<!DOCTYPE html>
<html>
<head>
  <title>MathArt</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 15px;
    }

    #calculator {
      width: 100%;
      height: 80vh;
      background: white;
    }

    button {
      padding: 12px 16px;
      margin: 5px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>MathArt</h1>
  <button onclick="makeTower(10)">Small</button>
  <button onclick="makeTower(25)">Big</button>
  <button onclick="makeTower(45)">Huge</button>
</header>

<div id="calculator"></div>

<script src="https://www.desmos.com/api/v1.11/calculator.js?apiKey=desmos"></script>

<script>
  let calculator;

  window.addEventListener("load", function () {
    if (!window.Desmos) {
      alert("Desmos did not load. Try running this on a real hosted website, not a blocked preview.");
      return;
    }

    calculator = Desmos.ScientificCalculator(
      document.getElementById("calculator")
    );

    makeTower(25);
  });

  function makeTower(layers) {
    if (!calculator) return;

    let latex = "\\frac{ }{ }";

    for (let i = 0; i < layers; i++) {
      latex = "\\frac{" + latex + "}{ }";
    }

    calculator.setExpression({
      id: "tower",
      latex: latex
    });
  }
</script>

</body>
</html>
